<script>
(function(){
  var PLAN = JSON.parse(document.getElementById('plan-data').textContent);
  var app = document.getElementById('app');
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var byId = function(id){ return PLAN.meals.find(function(m){ return m.id === id; }); };
  var dow = new Date().getDay();
  var tonight = (dow >= 1 && dow <= 5) ? PLAN.meals[dow - 1] || null : null;
  var nextUp = tonight || PLAN.meals[0];
  var stepPos = {};
  var KEY = 'kitchen-view-checked-' + PLAN.weekOf;
  var checked = {};
  try { checked = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { checked = {}; }
  function saveChecked(){ try { localStorage.setItem(KEY, JSON.stringify(checked)); } catch (e) {} }

  var ICON = {
    left:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    right:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
    x:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    timer:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.8M9.5 2.5h5"/></svg>',
    expand:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    shrink:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
  };

  function kindChip(m){ return m.kind === 'fish' ? '<span class="chip fish">Fish</span>' : '<span class="chip veg">Vegetarian</span>'; }
  function total(m){ return (m.prep || 0) + (m.cook || 0); }

  function renderWeek(){
    var cards = PLAN.meals.map(function(m){
      var isNext = m === nextUp;
      return '<button class="meal' + (isNext ? ' is-next' : '') + '" data-go="' + esc(m.id) + '">' +
        '<span class="day"><span class="eyebrow">' + esc(m.day) + '</span>' + (isNext ? '<span class="pill">' + (tonight ? 'Tonight' : 'Up next') + '</span>' : '') + '</span>' +
        '<h2>' + esc(m.name) + '</h2>' +
        '<p>' + esc(m.blurb) + '</p>' +
        '<span class="meta">' + kindChip(m) + '<span>' + total(m) + ' min</span><span>· ' + esc(m.cuisine) + '</span></span>' +
      '</button>';
    }).join('');
    app.innerHTML =
      '<header class="masthead enter"><div><div class="eyebrow">' + esc(PLAN.weekLabel) + '</div><h1>This week’s dinners</h1></div>' +
      (PLAN.sample ? '<span class="sample">Sample plan for testing</span>' : '') + '</header>' +
      '<section class="week">' + cards + '</section>' +
      '<p class="foot">Tap a dinner to see ingredients and start cooking. Everything is gluten-free and serves 2.</p>';
  }

  function renderRecipe(m){
    var ings = m.ingredients.map(function(i){
      var k = m.id + ':' + i.id, on = !!checked[k];
      return '<li><button class="ing" data-ing="' + esc(k) + '" aria-pressed="' + on + '">' +
        '<span class="box">' + ICON.check + '</span>' +
        '<span class="qty">' + esc(i.qty) + '</span>' +
        '<span class="item">' + esc(i.item) + (i.note ? '<small>' + esc(i.note) + '</small>' : '') + '</span>' +
      '</button></li>';
    }).join('');
    var have = m.ingredients.filter(function(i){ return checked[m.id + ':' + i.id]; }).length;
    var preview = m.steps.map(function(s){ return '<li>' + esc(s.text) + '</li>'; }).join('');
    var notes = (m.notes || []).map(function(n){ return '<li><span>' + esc(n) + '</span></li>'; }).join('');
    var resume = stepPos[m.id] > 0 && stepPos[m.id] < m.steps.length;
    app.innerHTML =
      '<div class="topbar"><button class="back" data-go="week">' + ICON.left + 'This week</button><span class="eyebrow">' + esc(m.day) + '</span></div>' +
      '<header class="recipe-head enter"><h1>' + esc(m.name) + '</h1>' +
      '<div class="facts">' + kindChip(m) + '<span>Prep <b>' + m.prep + ' min</b></span><span>Cook <b>' + m.cook + ' min</b></span><span>Serves <b>' + m.serves + '</b></span></div></header>' +
      '<div class="split">' +
        '<section class="panel"><h2>Ingredients <small id="have">' + have + ' of ' + m.ingredients.length + ' out</small></h2><ul class="ings">' + ings + '</ul></section>' +
        '<div class="plan">' +
          '<button class="start" data-cook="' + esc(m.id) + '">' + (resume ? 'Resume cooking' : 'Start cooking') + '<span>' + m.steps.length + ' steps' + ICON.right.replace('aria-hidden', 'style="vertical-align:-5px;margin-left:6px" aria-hidden') + '</span></button>' +
          (notes ? '<section class="panel"><h2>Before you start</h2><ul class="notes">' + notes + '</ul></section>' : '') +
          '<section class="panel"><h2>The plan</h2><ol class="preview">' + preview + '</ol></section>' +
        '</div>' +
      '</div>';
  }

  function renderCook(m){
    var i = stepPos[m.id] || 0, n = m.steps.length;
    var bars = m.steps.map(function(_, j){ return '<i class="' + (j <= i ? 'on' : '') + '"></i>'; }).join('');
    var top =
      '<div class="cook-top"><div class="row">' +
        '<button class="close" data-go="' + esc(m.id) + '" aria-label="Back to recipe">' + ICON.x + '</button>' +
        '<span class="title">' + esc(m.name) + '</span>' +
        '<span class="count">' + (i < n ? 'Step ' + (i + 1) + ' of ' + n : 'Done') + '</span>' + fsButton() +
      '</div><div class="progress" aria-hidden="true">' + bars + '</div></div>';

    if (i >= n) {
      app.innerHTML = '<div class="cook">' + top +
        '<section class="done enter"><div class="eyebrow">' + esc(m.day) + '</div><h1>Dinner’s ready.</h1>' +
        '<p>Enjoy. Leftovers keep 2 to 3 days in the fridge.</p>' +
        '<div class="actions"><button class="back" data-go="week">' + ICON.left + 'This week</button><button class="back" data-restart="' + esc(m.id) + '">Start over</button></div></section>' +
        '<div></div></div>';
      return;
    }

    var s = m.steps[i];
    var uses = (s.uses || []).map(function(id){
      var g = m.ingredients.find(function(x){ return x.id === id; });
      return g ? '<li><span class="qty">' + esc(g.qty) + '</span><span>' + esc(g.item) + '</span></li>' : '';
    }).join('');
    var timer = s.timer ? '<div class="timer">' + ICON.timer + '<b>' + s.timer + ' min</b><span>Say “Hey Siri, set a ' + s.timer + '-minute timer”</span></div>' : '';
    var side = (uses || timer) ? '<aside class="side">' + (uses ? '<h3>For this step</h3><ul class="uses">' + uses + '</ul>' : '') + timer + '</aside>' : '';

    app.innerHTML = '<div class="cook">' + top +
      '<section class="stage enter' + (side ? ' has-side' : '') + '" id="stage"><div><div class="step-num">Step ' + (i + 1) + '</div><p class="step-text">' + esc(s.text) + '</p></div>' + side + '</section>' +
      '<nav class="cook-nav"><button class="nav-btn" data-prev ' + (i === 0 ? 'disabled' : '') + '>' + ICON.left + 'Back</button>' +
      '<button class="nav-btn next" data-next>' + (i === n - 1 ? 'Finish' : 'Next step') + ICON.right + '</button></nav>' +
      '</div>';
  }

  // Full screen hides the viewer's and the browser's bars where the device allows it.
  var fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function fsButton(){
    if (!fsOK) return '';
    var on = isFs();
    return '<button class="close fs" data-fs aria-label="' + (on ? 'Exit full screen' : 'Full screen') + '">' + (on ? ICON.shrink : ICON.expand) + '</button>';
  }
  var toastTimer = null;
  function toast(msg){
    var t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 6000);
  }
  function screenInfo(){ return ' (page area ' + window.innerWidth + '×' + window.innerHeight + ')'; }
  function toggleFs(){
    if (!fsOK) { toast('This screen doesn’t allow full screen' + screenInfo()); return; }
    try {
      var p;
      if (isFs()) p = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { var el = document.documentElement; p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
      if (p && p.catch) p.catch(function(){ toast('Full screen was blocked' + screenInfo()); });
    } catch (e) { toast('Full screen was blocked' + screenInfo()); }
  }

  // Recipe markup (schema.org JSON-LD) so Safari can offer its own cooking view.
  function iso(min){ return 'PT' + (min || 0) + 'M'; }
  function setLD(m){
    var old = document.getElementById('recipe-ld'); if (old) old.remove();
    if (!m) return;
    var ld = {
      '@context':'https://schema.org', '@type':'Recipe',
      name:m.name, description:m.blurb, recipeCategory:'Dinner', recipeCuisine:m.cuisine,
      suitableForDiet:'https://schema.org/GlutenFreeDiet', keywords:'gluten-free, weeknight dinner',
      prepTime:iso(m.prep), cookTime:iso(m.cook), totalTime:iso(total(m)),
      recipeYield:String(m.serves) + ' servings',
      recipeIngredient:m.ingredients.map(function(g){ return g.qty + ' ' + g.item + (g.note ? ', ' + g.note : ''); }),
      recipeInstructions:m.steps.map(function(s, j){
        var t = s.text;
        if (s.timer && !/minute/i.test(t)) t += ' (about ' + s.timer + ' minutes)';
        return { '@type':'HowToStep', position:j + 1, text:t };
      })
    };
    var el = document.createElement('script');
    el.type = 'application/ld+json'; el.id = 'recipe-ld';
    el.textContent = JSON.stringify(ld);
    (document.head || document.body).appendChild(el);
  }

  // Keep the screen awake while cooking, where the browser allows it.
  var lock = null;
  function wantLock(on){
    if (on && !lock && navigator.wakeLock && document.visibilityState === 'visible') {
      navigator.wakeLock.request('screen').then(function(l){ lock = l; l.addEventListener('release', function(){ lock = null; }); }).catch(function(){});
    } else if (!on && lock) { try { lock.release(); } catch (e) {} lock = null; }
  }

  function route(){ return (location.hash || '').replace(/^#/, ''); }
  function render(){
    var r = route();
    if (!r && window.KV_PAGES && !window.KV_START && tonight) { location.replace(tonight.id + '.html'); return; }
    if (!r) { r = window.KV_START || (tonight ? tonight.id : 'week'); }
    var cook = /-cook$/.test(r);
    var m = byId(r.replace(/-cook$/, ''));
    if (m && cook) renderCook(m);
    else if (m) renderRecipe(m);
    else renderWeek();
    wantLock(!!(m && cook));
    document.body.classList.toggle('cooking', !!(m && cook));
    if (!window.KV_PAGES) setLD(m || nextUp);
    window.scrollTo(0, 0);
  }
  function go(h){
    if (window.KV_PAGES) {
      if (h === 'week') { location.href = 'index.html#week'; return; }
      if (byId(h) && h !== window.KV_START) { location.href = h + '.html'; return; }
    }
    if (route() === h) render(); else location.hash = h;
  }
  function current(){ var r = route(); return /-cook$/.test(r) ? byId(r.replace(/-cook$/, '')) : null; }
  function step(d){
    var m = current(); if (!m) return;
    var i = (stepPos[m.id] || 0) + d;
    if (i < 0 || i > m.steps.length) return;
    stepPos[m.id] = i; renderCook(m);
  }

  app.addEventListener('click', function(e){
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.go) return go(t.dataset.go);
    if (t.dataset.cook) {
      var mm = byId(t.dataset.cook);
      if (mm && !(stepPos[mm.id] > 0 && stepPos[mm.id] < mm.steps.length)) stepPos[mm.id] = 0;
      return go(t.dataset.cook + '-cook');
    }
    if (t.dataset.restart) { stepPos[t.dataset.restart] = 0; return renderCook(byId(t.dataset.restart)); }
    if (t.hasAttribute('data-fs')) return toggleFs();
    if (t.hasAttribute('data-next')) return step(1);
    if (t.hasAttribute('data-prev')) return step(-1);
    if (t.dataset.ing) {
      var k = t.dataset.ing, on = !checked[k];
      if (on) checked[k] = 1; else delete checked[k];
      saveChecked();
      t.setAttribute('aria-pressed', String(on));
      var mid = k.split(':')[0], m = byId(mid), have = document.getElementById('have');
      if (m && have) have.textContent = m.ingredients.filter(function(i){ return checked[m.id + ':' + i.id]; }).length + ' of ' + m.ingredients.length + ' out';
    }
  });

  // Swipe left/right on the step to move between steps.
  var sx = null, sy = null;
  app.addEventListener('pointerdown', function(e){ if (e.target.closest('#stage')) { sx = e.clientX; sy = e.clientY; } });
  app.addEventListener('pointerup', function(e){
    if (sx == null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy; sx = sy = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
  });

  document.addEventListener('keydown', function(e){
    if (!current()) return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'Escape') { go(current().id); }
  });
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && current()) wantLock(true); });
  function onFs(){ var m = current(); if (m) renderCook(m); }
  document.addEventListener('fullscreenchange', onFs);
  document.addEventListener('webkitfullscreenchange', onFs);
  window.addEventListener('hashchange', render);
  render();
})();
</script>

</body></html>
